name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller, onedir)
        run: |
          pyinstaller --noconfirm --windowed --name MOSCO --paths app `
            --collect-submodules mosco --collect-all onnxruntime --collect-all av `
            --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.QtMultimedia --exclude-module tkinter `
            app/main.py

      - name: Trim unused DLLs (안 쓰는 것 지우기)
        shell: pwsh
        run: |
          # v0.7.10: OpenCV 영상 입출력(ffmpeg 내장 — 우리는 cv2.VideoCapture 안 씀), Qt 소프트웨어 OpenGL·Quick·Qml·Pdf
          # 와 그것들을 끌어오는 플러그인(가상 키보드·PDF 그림 형식). 남은 것은 아래 Smoke test(exe 실행)로 확인.
          $root = (Resolve-Path dist/MOSCO).Path
          $pats = @("opencv_videoio_ffmpeg*.dll", "opengl32sw.dll", "Qt6Quick*.dll", "Qt6Qml*.dll", "Qt6Pdf*.dll",
                    "Qt6VirtualKeyboard*.dll", "qtvirtualkeyboardplugin.dll", "qpdf.dll", "QtQuick*.pyd", "QtQml*.pyd",
                    "QtPdf*.pyd")
          $sum = 0
          foreach ($p in $pats) {
            Get-ChildItem $root -Recurse -File -Filter $p | ForEach-Object {
              $sum += $_.Length
              Write-Host ("del {0,7:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($root.Length + 1))
              Remove-Item $_.FullName -Force
            }
          }
          Get-ChildItem $root -Recurse -Directory -Filter qml | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          "removed {0:N1} MB" -f ($sum / 1MB) | Write-Host

      # FFmpeg: 정상일 때 받아서 캐시를 새로 저장, 다운로드 장애(504/503 등)면 마지막으로 저장한 캐시를 씀
      - name: Download FFmpeg (BtbN GPL shared build)
        id: dl
        shell: pwsh
        run: |
          # v0.7.9: 정적(ffmpeg.exe·ffprobe.exe 가 라이브러리를 각자 통째로) → 공유(DLL 을 함께 씀)
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          $ok = $false
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest $url -OutFile ffmpeg.zip -TimeoutSec 300
              Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_test -Force      # 받다 끊긴 zip 걸러냄
              Remove-Item ffmpeg_test -Recurse -Force
              $ok = $true; break
            } catch {
              Write-Host "download try $i failed: $($_.Exception.Message)"
              Remove-Item ffmpeg.zip, ffmpeg_test -Recurse -Force -ErrorAction SilentlyContinue
              if ($i -lt 3) { Start-Sleep -Seconds 20 }
            }
          }
          if ($ok) {
            $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.Substring(0, 16)
            "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "hash=$h" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "FFmpeg: 새로 받음 ($h)"
          } else {
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::warning::FFmpeg 다운로드 실패 → 마지막 캐시 사용"
          }

      - name: Save FFmpeg cache (정상일 때 새로 저장)
        if: steps.dl.outputs.ok == 'true'
        continue-on-error: true            # 같은 빌드(같은 해시)가 이미 저장돼 있으면 건너뜀
        uses: actions/cache/save@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-gpl-shared-${{ steps.dl.outputs.hash }}

      - name: Restore FFmpeg cache (다운로드 장애 때)
        if: steps.dl.outputs.ok != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-gpl-shared-none
          restore-keys: ffmpeg-gpl-shared-      # 가장 최근에 저장한 것
          fail-on-cache-miss: true

      - name: Add FFmpeg + models
        shell: pwsh
        run: |
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          $bin = Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/MOSCO/bin | Out-Null
          Copy-Item $bin.FullName dist/MOSCO/bin/
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") dist/MOSCO/bin/
          Copy-Item (Join-Path $bin.DirectoryName "*.dll") dist/MOSCO/bin/
          New-Item -ItemType Directory -Force dist/MOSCO/models | Out-Null
          Copy-Item models/* dist/MOSCO/models/
          Copy-Item README.md dist/MOSCO/사용법.md
          & dist/MOSCO/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'app'); import mosco; print(mosco.__version__)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MOSCO version $v"

      - name: Engine test (합성 FHD 29.97 ProRes)
        shell: pwsh
        run: |
          $env:PATH = "$PWD/dist/MOSCO/bin;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUNBUFFERED = "1"
          python tests/test_engine.py engine_test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_edits.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_track.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_aefx.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tests/test_priority.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # test_auto 는 끝에서 os._exit 로 즉시 종료(스레드 조인 회피)라 윈도우 종료코드가 불안정 → 성공 표식으로 판정
          $out = python tests/test_auto.py engine_test/synth.mov auto_test 2>&1 | Out-String
          Write-Host $out
          if (-not ($out -match "AUTO TEST OK")) { exit 1 }
          $env:QT_QPA_PLATFORM = "offscreen"
          $out = python tests/test_renderprog.py engine_test/synth.mov renderprog_test 2>&1 | Out-String
          Write-Host $out
          if (-not ($out -match "RENDERPROG OK")) { exit 1 }
          $out = python tests/test_exit.py 2>&1 | Out-String
          Write-Host $out
          if ($out -match "EXIT OK") { exit 0 } else { exit 1 }

      - name: UI test (오프스크린)
        shell: pwsh
        run: |
          $env:PATH = "$PWD/dist/MOSCO/bin;$env:PATH"
          $env:PYTHONIOENCODING = "utf-8"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PYTHONUNBUFFERED = "1"
          $env:PYTHONFAULTHANDLER = "1"
          python tests/test_ui_smoke.py engine_test/synth.mov ui_shots
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Front test (창 맨 앞으로, 윈도우 데스크톱)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUNBUFFERED = "1"
          python tests/test_front.py

      - name: Smoke test (exe 실행 + 모델 로드)
        shell: pwsh
        run: |
          $env:MOSCO_SELFTEST = "1"
          $p = Start-Process dist/MOSCO/MOSCO.exe -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item -Recurse -Force dist/MOSCO/cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force dist/MOSCO/presets -ErrorAction SilentlyContinue
          Remove-Item -Force dist/MOSCO/settings.json -ErrorAction SilentlyContinue

      - name: Size report (빌드 용량 실측)
        shell: pwsh
        run: |
          $root = (Resolve-Path dist/MOSCO).Path
          $all = Get-ChildItem $root -Recurse -File
          "TOTAL {0:N1} MB  files {1}" -f (($all | Measure-Object Length -Sum).Sum / 1MB), $all.Count | Write-Host
          Write-Host "--- 폴더별(2단계) ---"
          $all | Group-Object { $r = $_.FullName.Substring($root.Length + 1); $p = $r.Split('\'); if ($p.Length -ge 3) { $p[0] + '\' + $p[1] } else { $p[0] } } |
            ForEach-Object { [pscustomobject]@{ MB = [math]::Round(($_.Group | Measure-Object Length -Sum).Sum / 1MB, 1); Path = $_.Name } } |
            Sort-Object MB -Descending | Select-Object -First 25 | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          Write-Host "--- 큰 파일 30 ---"
          $all | Sort-Object Length -Descending | Select-Object -First 30 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($root.Length + 1) } | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: MOSCO-${{ steps.ver.outputs.version }}-windows
          path: dist/MOSCO
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots
          path: ui_shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/MOSCO -DestinationPath MOSCO-${{ github.ref_name }}-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MOSCO-${{ github.ref_name }}-windows.zip
